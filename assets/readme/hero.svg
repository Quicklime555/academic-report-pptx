<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">academic-report-pptx</title>
  <desc id="desc">A restrained academic workflow that turns evidence, a talk manuscript, and a user template into an editable PowerPoint and a page-aligned rehearsal script.</desc>
  <rect width="1200" height="420" rx="24" fill="#F4F1E8"/>
  <rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#D4D0C4" stroke-width="2"/>
  <g id="title-block" transform="translate(58 48)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="0" y="0" dominant-baseline="hanging" font-size="18" font-weight="700" letter-spacing="2.5" fill="#397A78">ACADEMIC PRESENTATION WORKFLOW</text>
    <text x="0" y="52" dominant-baseline="hanging" font-size="52" font-weight="750" fill="#172B3A">academic-report-pptx</text>
    <text x="0" y="126" dominant-baseline="hanging" font-size="25" font-weight="600" fill="#172B3A">先把学术汇报讲清楚，</text>
    <text x="0" y="163" dominant-baseline="hanging" font-size="25" font-weight="600" fill="#172B3A">再交付可编辑 PPTX 与逐页排练稿。</text>
    <g id="process-strip" transform="translate(0 244)">
      <path d="M18 14 H458" fill="none" stroke="#A8A397" stroke-width="2"/>
      <g fill="#F4F1E8" stroke="#397A78" stroke-width="3">
        <circle cx="18" cy="14" r="9"/>
        <circle cx="128" cy="14" r="9"/>
        <circle cx="238" cy="14" r="9"/>
        <circle cx="348" cy="14" r="9"/>
        <circle cx="458" cy="14" r="9"/>
      </g>
      <g font-size="18" font-weight="650" fill="#4E5961">
        <text x="0" y="48">证据</text><text x="109" y="48">大纲</text><text x="219" y="48">母稿</text><text x="329" y="48">页面</text><text x="438" y="48">验收</text>
      </g>
    </g>
  </g>
  <g id="paired-output" transform="translate(648 42)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="30" y="30" width="448" height="300" rx="12" fill="#D7D2C6"/>
    <rect x="0" y="0" width="448" height="300" rx="12" fill="#FFFFFF" stroke="#172B3A" stroke-width="3"/>
    <rect x="0" y="0" width="448" height="46" rx="10" fill="#172B3A"/>
    <rect x="0" y="36" width="448" height="10" fill="#172B3A"/>
    <text x="24" y="29" font-size="18" font-weight="700" fill="#FFFFFF">SLIDE 08 · KEY RESULT</text>
    <text x="24" y="84" font-size="25" font-weight="750" fill="#172B3A">结果不是终点，解释才是</text>
    <g id="result-chart" transform="translate(26 116)">
      <path d="M0 124 H244 M0 0 V124" fill="none" stroke="#A8A397" stroke-width="2"/>
      <path d="M8 106 C54 102 66 89 104 88 S154 58 186 62 S222 28 238 20" fill="none" stroke="#397A78" stroke-width="5"/>
      <circle cx="186" cy="62" r="7" fill="#D66A3D"/>
      <path d="M194 56 L222 38" fill="none" stroke="#D66A3D" stroke-width="2"/>
      <text x="152" y="14" font-size="18" font-weight="700" fill="#D66A3D">关键发现</text>
    </g>
    <g id="traceability" transform="translate(296 116)">
      <text x="0" y="0" dominant-baseline="hanging" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" fill="#397A78">E014 → B008 → S008</text>
      <text x="0" y="40" dominant-baseline="hanging" font-size="18" fill="#4E5961">证据</text><text x="0" y="72" dominant-baseline="hanging" font-size="18" fill="#4E5961">讲述单元</text><text x="0" y="104" dominant-baseline="hanging" font-size="18" fill="#4E5961">最终页面</text>
      <rect x="0" y="145" width="116" height="34" rx="17" fill="#E7F0EE"/>
      <text x="58" y="168" text-anchor="middle" font-size="17" font-weight="700" fill="#286663">可核对</text>
    </g>
    <g id="rehearsal-script" transform="translate(166 260)">
      <rect width="262" height="92" rx="10" fill="#FFF8F0" stroke="#D66A3D" stroke-width="2"/>
      <text x="18" y="28" font-size="18" font-weight="750" fill="#172B3A">逐页排练稿</text>
      <text x="18" y="57" font-size="17" fill="#4E5961">00:55 · 看图 · 讲结论 · 切页</text>
      <path d="M18 72 H238" stroke="#D8CABB" stroke-width="2"/>
    </g>
  </g>
</svg>
